# -- Exa search config --
# Used by /career-ops scan when Exa MCP is available (Level 0 — highest priority).
# Exa finds fresher results than WebSearch and supports date-range filtering.

exa_config:
  recency_days: 3          # only return results posted in last N days
  location_preference:
    - "Bangalore"
    - "Bengaluru"
    - "India"
    - "remote"             # remote-friendly roles are valid for India-based candidate
  boost_location: true     # deprioritize US/UK/EU-only roles
  domains:                 # exhaustive list of job sites Exa should search
    # Indian job boards
    - naukri.com
    - linkedin.com
    - instahyre.com
    - cutshort.io
    - hirist.tech
    - iimjobs.com
    - foundit.in
    - in.indeed.com
    - shine.com
    - unstop.com
    - wellfound.com
    # ATS portals (global, but India cos use these)
    - jobs.ashbyhq.com
    - job-boards.greenhouse.io
    - boards.greenhouse.io
    - jobs.lever.co
    - apply.workable.com
    # Direct company career pages
    - careers.google.com
    - amazon.jobs
    - microsoft.com/careers
    - flipkart.com/careers
    - razorpay.com/careers
    - swiggy.com/careers
    - meesho.io/careers
    - phonepe.com/careers
    # Social signal sources
    - x.com
    - twitter.com
    - linkedin.com/posts
  exa_queries:
    - name: "Exa — Data Engineer Bangalore fresh"
      query: "Senior Data Engineer OR Staff Data Engineer Bangalore India hiring 2026"
      category: "job posting"
    - name: "Exa — AI ML Engineer India fresh"
      query: "AI Engineer OR ML Engineer OR GenAI Engineer Bangalore India hiring"
      category: "job posting"
    - name: "Exa — SDE2 India fresh"
      query: "SDE-2 OR Software Engineer II Bangalore India tech startup"
      category: "job posting"
    - name: "Exa — LLMOps Data Platform India"
      query: "LLMOps OR MLOps OR Data Platform Engineer India remote"
      category: "job posting"
    - name: "Exa — Kafka Flink Spark India"
      query: "Kafka OR Flink OR Spark data engineer senior Bangalore India"
      category: "job posting"
    - name: "Exa — Twitter hiring Data AI India"
      query: "hiring data engineer AI engineer Bangalore India referral"
      category: "tweet"
    - name: "Exa — LinkedIn hiring posts India"
      query: "we are hiring data engineer ML engineer Bangalore India"
      category: "linkedin post"

