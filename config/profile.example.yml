# Career-Ops Profile Configuration
# Copy this file to config/profile.yml and fill in your details.
# This is the single source of truth for your personal data across all modes.

candidate:
  full_name: "Your Name"
  email: "you@example.com"
  phone: "+91-9999999999"
  location: "Bangalore, India"
  linkedin: "linkedin.com/in/yourprofile"
  portfolio_url: ""
  github: "github.com/yourusername"
  twitter: ""

target_roles:
  # Your North Star roles — what you're optimizing for
  primary:
    - "Senior Data Engineer"
    - "AI Platform Engineer"
    - "ML Engineer"
    - "SDE-2"
  # Archetypes help the evaluation system score fit
  archetypes:
    - name: "Data Platform / Senior Data Engineer"
      level: "Senior/Staff"
      fit: "primary"        # primary = dream role, secondary = good fit, adjacent = stretch
    - name: "AI/ML Engineer"
      level: "Senior/SDE-2+"
      fit: "primary"
    - name: "Backend / Infrastructure Engineer"
      level: "SDE-2+"
      fit: "secondary"

narrative:
  # Your professional headline (1 line)
  headline: "Senior Data Engineer & AI Systems Builder"
  # Your exit story — what makes you unique
  exit_story: "Built data + AI platform from 0→1. Looking for a senior/staff role at scale."
  # Your top 3-5 superpowers
  superpowers:
    - "End-to-end data platform (ingestion → streaming → ML)"
    - "Production AI systems at scale"
    - "Fast 0→1 builder"
  # Proof points — your top measurable achievements
  proof_points:
    - name: "Data Platform"
      hero_metric: "Replaced paid tool, saved $X/year"
    - name: "Real-time pipeline"
      hero_metric: "Xk events/day, <Xms p99"
    - name: "AI/ML project"
      hero_metric: "X% improvement on key metric"

compensation:
  target_range: "30-50 LPA"
  currency: "INR"
  minimum: "22 LPA"
  location_flexibility: "Bangalore preferred; open to remote; hybrid negotiable"

location:
  country: "India"
  city: "Bangalore"
  timezone: "IST (UTC+5:30)"
  visa_status: "Indian citizen, no sponsorship needed for India roles"
  onsite_availability: "Flexible — prefer hybrid or remote"

language:
  modes_dir: "modes"   # Switch to "modes/de" for German-language roles

# -- Automated trigger config --
# Filled in by /career-ops-setup. Edit manually if needed.
trigger:
  digest_to: "you@example.com"           # email for job digest (defaults to candidate.email)
  recency_days: 3                        # surface jobs posted in last N days
  github_repo: "https://github.com/yourusername/career-ops"
  location_keywords:                     # appended to every search query
    - "Bangalore"
    - "Bengaluru"
    - "India"
    - "remote"
